<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chart Demo Menu</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .menu {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      text-align: center;
      width: min(540px, 100%);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 2.5vw, 2.5rem);
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .buttons button {
      min-width: 120px;
      padding: 14px 18px;
      border: none;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 140ms ease, background-color 140ms ease;
    }

    .buttons button:hover {
      transform: translateY(-1px);
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="menu">
    <h1>Chart Demo</h1>
    <p>Select a chart page to view the demo.</p>
    <div class="buttons">
      <button type="button" onclick="window.location.href='bar.html'">Bar</button>
      <button type="button" onclick="window.location.href='line.html'">Line</button>
      <button type="button" onclick="window.location.href='pie.html'">Pie</button>
    </div>
  </div>
</body>
</html>
